<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>忘记密码 · 知天</title><link rel="icon" type="image/png" sizes="32x32" href="./css/brand/favicon-32.png?v=20260930"><link rel="apple-touch-icon" href="./css/brand/apple-touch-icon.png?v=20260930"><link rel="stylesheet" href="./css/style.css?v=lamp-node-20260930" /></head>
  <body class="auth-page">
    <main class="auth-shell">
    <section class="auth-intro" aria-label="密码安全说明"><div><div class="brand-mark" aria-hidden="true"><img src="./css/brand/avatar-128.webp?v=20260930" width="128" height="128" alt="" decoding="async"></div><p class="intro-title">找回访问权，不暴露旧密码。</p><p>系统不会读取或发送旧密码。验证通过后生成一次性新密码。</p><div class="auth-assurances"><span>旧密码立即失效</span><span>一次性密码只展示一次</span><span>同邮箱企业职责同步更新</span></div></div><small>安全找回</small></section>
    <div class="auth-form-area"><section class="auth-card">
      <div class="auth-heading"><p class="eyebrow">找回密码</p><h1>验证企业身份</h1><p class="muted">完成邮箱与企业准入验证后，系统将生成一次性新密码。</p></div>
      <form id="forgotPasswordForm" class="form-stack">
        <fieldset class="auth-step"><legend>01 / 身份信息</legend>
        <label><span>企业邮箱</span><input id="email" type="email" autocomplete="email" placeholder="填写企业邮箱" required /></label>
        </fieldset><fieldset class="auth-step"><legend>02 / 企业身份</legend>
        <label><span>企业准入密码</span><input id="enterprisePassword" type="password" autocomplete="off" placeholder="由企业管理员提供" required /><small class="field-hint">发送验证码前必须填写。</small></label>
        </fieldset><fieldset class="auth-step"><legend>03 / 邮箱验证</legend>
        <label><span>邮箱验证码</span><div class="inline-actions"><input id="verificationCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6位验证码" required /><button id="sendCodeButton" type="button">获取验证码</button></div></label>
        <p id="message" class="message" aria-live="polite"></p>
        <button id="submitButton" type="submit" class="btn-block">生成一次性新密码</button>
      </fieldset></form>
      <div id="passwordResult" class="result-box hidden" aria-live="polite"><span class="muted">一次性新密码</span><strong id="newPassword" class="one-time-password"></strong><p>请立即保存并妥善保管；关闭页面后不会再次显示。</p></div>
      <p class="auth-link"><a href="./login.html">返回登录</a></p>
    </section></div></main>
    <script src="./config.js"></script><script src="./js/api.js?v=lamp-node-20260930"></script><script src="./js/forgot-password.js?v=lamp-node-20260930"></script>
  </body>
</html>
